<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>홍열이네 · 잠깐 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#18140f;
    --surface:#251f18;
    --surface-2:#2f271d;
    --amber:#e8a33d;
    --amber-dim:#a9752c;
    --cream:#f3ead9;
    --taupe:#a89380;
    --stamp-empty:#3a3227;
    --red:#b8433a;
    --green:#5a9c5f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(circle at 50% 0%, #241d15 0%, var(--bg) 55%);
    color:var(--cream);
    font-family:'Noto Sans KR', sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px 16px; overflow-x:hidden;
  }
  .frame{ width:100%; max-width:400px; position:relative; }
  .brand{ text-align:center; margin-bottom:18px; user-select:none; }
  .brand .mark{
    font-family:'Black Han Sans', sans-serif; font-size:15px;
    letter-spacing:0.14em; color:var(--amber); cursor:pointer;
  }
  .brand .sub{ margin-top:4px; font-size:11px; color:var(--taupe); letter-spacing:0.05em; }

  .stamps{ display:flex; justify-content:center; gap:10px; margin-bottom:22px; }
  .stamp{
    width:30px; height:30px; border-radius:50%;
    border:2px dashed var(--stamp-empty);
    display:flex; align-items:center; justify-content:center;
    font-family:'Black Han Sans', sans-serif; font-size:13px; color:var(--stamp-empty);
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
  }
  .stamp.done{
    border:2px solid var(--amber); color:var(--bg); background:var(--amber);
    transform:scale(1.08) rotate(-6deg); box-shadow:0 0 0 3px rgba(232,163,61,0.15);
  }
  .stamp.current{ border-color:var(--amber); color:var(--amber); }

  .ticket{
    background:var(--surface); border-radius:18px; padding:30px 24px 26px;
    position:relative; box-shadow:0 20px 40px rgba(0,0,0,0.35);
    min-height:280px; display:flex; flex-direction:column;
  }
  .ticket::before,.ticket::after{
    content:""; position:absolute; width:20px; height:20px;
    background:var(--bg); border-radius:50%; top:50%; transform:translateY(-50%);
  }
  .ticket::before{ left:-10px; }
  .ticket::after{ right:-10px; }

  .eyebrow{ font-size:12px; color:var(--amber); letter-spacing:0.12em; font-weight:700; margin-bottom:10px; }
  .question{ font-size:21px; font-weight:900; line-height:1.4; margin-bottom:22px; min-height:58px; }

  .input-wrap{ border-top:1px dashed #46392a; border-bottom:1px dashed #46392a; padding:16px 0; margin-bottom:8px; }
  input[type=text]{
    width:100%; background:transparent; border:none; outline:none; color:var(--cream);
    font-family:'Noto Sans KR', sans-serif; font-size:17px; font-weight:500; padding:6px 2px;
    text-align:center;
  }
  input[type=text]::placeholder{ color:#5f5347; font-weight:400; }
  .counter{ text-align:right; font-size:11px; color:var(--taupe); letter-spacing:0.03em; }
  .counter.warn{ color:var(--red); }

  .spacer{flex:1;}

  .actions{ display:flex; gap:10px; margin-top:18px; }
  button{
    font-family:'Noto Sans KR', sans-serif; border:none; border-radius:12px;
    padding:15px 0; font-size:15px; font-weight:700; cursor:pointer; flex:1;
    transition:transform .15s ease, opacity .15s ease;
  }
  button:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--amber); color:#20180d; }
  .btn-primary:disabled{ background:var(--stamp-empty); color:#8a7c6a; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--taupe); flex:0 0 72px; }
  .btn-outline{ background:transparent; border:1px solid #46392a; color:var(--cream); }

  .center-panel{ text-align:center; }
  .center-panel .big{
    font-family:'Black Han Sans', sans-serif; font-size:26px; color:var(--amber);
    margin-bottom:10px; line-height:1.35;
  }
  .center-panel p{ color:var(--taupe); font-size:13.5px; line-height:1.6; margin:0 0 22px; }
  .count-badge{
    display:inline-block; background:var(--surface-2); border:1px solid #46392a;
    border-radius:999px; padding:7px 16px; font-size:12px; color:var(--amber);
    margin-bottom:20px; letter-spacing:0.02em;
  }
  .anon-note{ text-align:center; font-size:11px; color:#6b5f51; margin-top:16px; letter-spacing:0.02em; }

  .code-box{
    background:var(--surface-2);
    border:2px dashed var(--amber);
    border-radius:14px;
    padding:16px;
    margin-bottom:18px;
  }
  .code-box .label{ font-size:11px; color:var(--taupe); margin-bottom:6px; }
  .code-box .code{
    font-family:'Black Han Sans', sans-serif;
    font-size:32px; letter-spacing:0.18em; color:var(--amber);
  }

  .screen{ display:none; }
  .screen.active{ display:flex; flex-direction:column; }

  @keyframes slideIn{ from{ opacity:0; transform:translateX(14px);} to{ opacity:1; transform:translateX(0);} }
  .ticket.animate{ animation:slideIn .3s ease; }

  .admin-menu{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }

  .admin-list{
    max-height:260px; overflow-y:auto; text-align:left; font-size:12.5px; color:var(--cream);
    background:var(--surface-2); border-radius:10px; padding:12px; margin-bottom:14px;
  }
  .admin-list .row{ padding:8px 0; border-bottom:1px solid #3a3226; }
  .admin-list .row:last-child{ border-bottom:none; }
  .admin-list .row .t{ color:#6b5f51; font-size:10.5px; margin-bottom:3px; display:flex; justify-content:space-between; }
  .tag-used{ color:var(--taupe); }
  .tag-unused{ color:var(--amber); }

  .lookup-result{
    border-radius:12px; padding:16px; margin-bottom:14px; font-size:14px; line-height:1.6;
  }
  .lookup-ok{ background:rgba(90,156,95,0.12); border:1px solid var(--green); }
  .lookup-used{ background:rgba(184,67,58,0.12); border:1px solid var(--red); }
  .lookup-none{ background:var(--surface-2); border:1px solid #46392a; color:var(--taupe); }
</style>
</head>
<body>

<div class="frame">
  <div class="brand">
    <div class="mark" id="logoTap">홍 열 이 네</div>
    <div class="sub">시청점 · 익명 만족도 설문</div>
  </div>

  <div class="stamps" id="stampRow"></div>

  <!-- INTRO -->
  <div class="screen active" id="screen-intro">
    <div class="ticket center-panel">
      <div class="big">30초면 충분해요</div>
      <p>불편했던 점 딱 5가지만 짧게 남겨주세요.<br>이름도, 개인정보도 남지 않는 완전 익명 설문입니다.</p>
      <div class="count-badge" id="introCount">참여 인원 불러오는 중…</div>
      <button class="btn-primary" onclick="startSurvey()">시작하기</button>
    </div>
    <div class="anon-note">응답은 저장되지만 누가 남겼는지는 절대 알 수 없어요</div>
  </div>

  <!-- QUESTIONS -->
  <div class="screen" id="screen-q">
    <div class="ticket animate">
      <div class="eyebrow" id="qEyebrow">Q1 / 5</div>
      <div class="question" id="qText"></div>
      <div class="input-wrap">
        <input type="text" id="qInput" maxlength="20" placeholder="여기에 짧게 적어주세요" autocomplete="off">
        <div class="counter" id="qCounter">0 / 20</div>
      </div>
      <div class="spacer"></div>
      <div class="actions">
        <button class="btn-ghost" id="btnBack" onclick="goBack()">이전</button>
        <button class="btn-primary" id="btnNext" disabled onclick="goNext()">다음</button>
      </div>
    </div>
  </div>

  <!-- DONE -->
  <div class="screen" id="screen-done">
    <div class="ticket center-panel">
      <div class="big">참여해주셔서<br>감사합니다 🙌</div>
      <div class="code-box">
        <div class="label">이 코드를 직원에게 보여주세요</div>
        <div class="code" id="doneCode">----</div>
      </div>
      <div class="count-badge" id="doneCount">참여 인원 집계 중…</div>
      <button class="btn-primary" onclick="resetSurvey()">닫기</button>
    </div>
  </div>

  <!-- ADMIN HOME -->
  <div class="screen" id="screen-admin-home">
    <div class="ticket center-panel">
      <div class="big" style="font-size:19px;">관리자 메뉴</div>
      <div class="admin-menu">
        <button class="btn-outline" onclick="openCodeCheck()">코드 확인 · 서비스 처리</button>
        <button class="btn-outline" onclick="openResponseList()">전체 응답 보기</button>
      </div>
      <button class="btn-primary" onclick="closeAdmin()" style="margin-top:16px;">닫기</button>
    </div>
  </div>

  <!-- ADMIN: CODE CHECK -->
  <div class="screen" id="screen-code-check">
    <div class="ticket center-panel">
      <div class="big" style="font-size:19px;">코드 확인</div>
      <div class="input-wrap" style="margin-bottom:16px;">
        <input type="text" id="codeInput" maxlength="4" placeholder="손님이 보여준 코드 입력" autocomplete="off" style="text-transform:uppercase; font-size:22px; letter-spacing:0.2em;">
      </div>
      <button class="btn-primary" onclick="checkCode()" style="margin-bottom:14px;">확인</button>
      <div id="codeResult"></div>
      <button class="btn-outline" onclick="show('screen-admin-home')">뒤로</button>
    </div>
  </div>

  <!-- ADMIN: RESPONSE LIST -->
  <div class="screen" id="screen-admin-list">
    <div class="ticket center-panel">
      <div class="big" style="font-size:19px;">전체 응답</div>
      <div class="admin-list" id="adminList"></div>
      <button class="btn-outline" onclick="show('screen-admin-home')">뒤로</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  "오늘 가장 불편했던 점은?",
  "음식제공시간은 어떠셨나요?",
  "좌석/자리는 편하셨나요?",
  "직원 응대 중 아쉬운 점은?",
  "매장 또는 테이블 청결은 어땠나요?"
];
const COUNT_KEY = "hongyeol-survey:count";
const RESPONSES_KEY = "hongyeol-survey:responses";
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let current = 0;
let answers = new Array(QUESTIONS.length).fill("");
let logoTapCount = 0;
let logoTapTimer = null;

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function renderStamps(){
  const row = document.getElementById("stampRow");
  row.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const d = document.createElement("div");
    d.className = "stamp" + (i < current ? " done" : (i===current ? " current" : ""));
    d.textContent = (i < current) ? "✓" : (i+1);
    row.appendChild(d);
  }
}

async function loadCount(){
  try{
    const res = await window.storage.get(COUNT_KEY, true);
    return res && res.value ? parseInt(res.value, 10) : 0;
  }catch(e){ return 0; }
}

async function loadResponses(){
  try{
    const res = await window.storage.get(RESPONSES_KEY, true);
    return res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ return []; }
}

async function refreshIntroCount(){
  const n = await loadCount();
  document.getElementById("introCount").textContent = `지금까지 ${n}명이 참여했어요`;
}

function startSurvey(){
  current = 0;
  answers = new Array(QUESTIONS.length).fill("");
  show("screen-q");
  renderQuestion();
}

function renderQuestion(){
  renderStamps();
  document.getElementById("qEyebrow").textContent = `Q${current+1} / ${QUESTIONS.length}`;
  document.getElementById("qText").textContent = QUESTIONS[current];
  const input = document.getElementById("qInput");
  input.value = answers[current] || "";
  updateCounter();
  document.getElementById("btnBack").style.visibility = current === 0 ? "hidden" : "visible";
  document.getElementById("btnNext").textContent = current === QUESTIONS.length - 1 ? "제출하기" : "다음";
  input.focus();

  const ticket = document.querySelector("#screen-q .ticket");
  ticket.classList.remove("animate");
  void ticket.offsetWidth;
  ticket.classList.add("animate");
}

function updateCounter(){
  const val = document.getElementById("qInput").value;
  const len = val.length;
  const counterEl = document.getElementById("qCounter");
  counterEl.textContent = `${len} / 20`;
  counterEl.classList.toggle("warn", len >= 20);
  document.getElementById("btnNext").disabled = len === 0;
}

document.getElementById("qInput").addEventListener("input", updateCounter);
document.getElementById("qInput").addEventListener("keydown", (e)=>{
  if(e.key === "Enter" && !document.getElementById("btnNext").disabled){ goNext(); }
});

function goBack(){
  if(current === 0) return;
  answers[current] = document.getElementById("qInput").value;
  current--;
  renderQuestion();
}

async function goNext(){
  answers[current] = document.getElementById("qInput").value.trim();
  if(current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
  } else {
    await submitSurvey();
  }
}

function generateCode(){
  let c = "";
  for(let i=0;i<4;i++){ c += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]; }
  return c;
}

async function submitSurvey(){
  document.getElementById("btnNext").disabled = true;
  document.getElementById("btnNext").textContent = "저장 중…";
  try{
    const n = await loadCount();
    const newCount = n + 1;
    await window.storage.set(COUNT_KEY, String(newCount), true);

    let list = await loadResponses();
    let code = generateCode();
    const existingCodes = new Set(list.map(r => r.code));
    while(existingCodes.has(code)){ code = generateCode(); }

    list.push({
      id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
      time: new Date().toISOString(),
      answers: answers,
      code: code,
      redeemed: false,
      redeemedAt: null
    });
    if(list.length > 500) list = list.slice(list.length - 500);
    await window.storage.set(RESPONSES_KEY, JSON.stringify(list), true);

    current = QUESTIONS.length;
    renderStamps();
    document.getElementById("doneCode").textContent = code;
    document.getElementById("doneCount").textContent = `누적 참여 ${newCount}명`;
    show("screen-done");
  }catch(e){
    document.getElementById("doneCode").textContent = "오류";
    document.getElementById("doneCount").textContent = "제출 중 오류가 발생했어요. 다시 시도해주세요.";
    show("screen-done");
  }
}

function resetSurvey(){
  current = 0;
  answers = new Array(QUESTIONS.length).fill("");
  show("screen-intro");
  refreshIntroCount();
}

// hidden admin entry — tap the logo 5 times within 1.5s
document.getElementById("logoTap").addEventListener("click", ()=>{
  logoTapCount++;
  clearTimeout(logoTapTimer);
  logoTapTimer = setTimeout(()=>{ logoTapCount = 0; }, 1500);
  if(logoTapCount >= 5){
    logoTapCount = 0;
    openAdminGate();
  }
});

async function openAdminGate(){
  const pass = prompt("관리자 코드를 입력하세요");
  if(pass !== "1234"){
    if(pass !== null) alert("코드가 올바르지 않습니다.");
    return;
  }
  show("screen-admin-home");
}

function closeAdmin(){
  show("screen-intro");
  refreshIntroCount();
}

function openCodeCheck(){
  document.getElementById("codeInput").value = "";
  document.getElementById("codeResult").innerHTML = "";
  show("screen-code-check");
  setTimeout(()=>document.getElementById("codeInput").focus(), 50);
}

async function checkCode(){
  const input = document.getElementById("codeInput").value.trim().toUpperCase();
  const resultEl = document.getElementById("codeResult");
  if(!input){ return; }
  resultEl.innerHTML = "확인 중…";
  const list = await loadResponses();
  const idx = list.findIndex(r => r.code === input);

  if(idx === -1){
    resultEl.innerHTML = `<div class="lookup-result lookup-none">유효하지 않은 코드입니다.<br>손님에게 코드를 다시 확인해주세요.</div>`;
    return;
  }

  const entry = list[idx];
  if(entry.redeemed){
    const t = entry.redeemedAt ? new Date(entry.redeemedAt).toLocaleString('ko-KR') : "";
    resultEl.innerHTML = `<div class="lookup-result lookup-used">이미 사용된 코드입니다.<br>처리 시각: ${t}</div>`;
  } else {
    resultEl.innerHTML = `
      <div class="lookup-result lookup-ok">
        사용 가능한 코드입니다.<br>서비스를 제공하고 아래 버튼을 눌러 처리해주세요.
      </div>
      <button class="btn-primary" style="width:100%; margin-bottom:14px;" onclick="redeemCode('${entry.id}')">서비스 제공 처리</button>
    `;
  }
}

async function redeemCode(id){
  let list = await loadResponses();
  const idx = list.findIndex(r => r.id === id);
  if(idx === -1) return;
  list[idx].redeemed = true;
  list[idx].redeemedAt = new Date().toISOString();
  await window.storage.set(RESPONSES_KEY, JSON.stringify(list), true);
  document.getElementById("codeResult").innerHTML = `<div class="lookup-result lookup-ok">처리 완료! 서비스를 제공해주세요.</div>`;
}

async function openResponseList(){
  const listEl = document.getElementById("adminList");
  listEl.innerHTML = "불러오는 중…";
  show("screen-admin-list");
  const list = await loadResponses();
  if(list.length === 0){
    listEl.innerHTML = "<div style='color:#6b5f51'>아직 응답이 없습니다.</div>";
  } else {
    listEl.innerHTML = list.slice().reverse().map(r => {
      const t = new Date(r.time).toLocaleString('ko-KR');
      const lines = r.answers.map((a,i) => `${i+1}. ${a || "(무응답)"}`).join("<br>");
      const tag = r.redeemed ? `<span class="tag-used">사용됨</span>` : `<span class="tag-unused">미사용</span>`;
      return `<div class="row"><div class="t"><span>${t} · 코드 ${r.code || "-"}</span>${tag}</div>${lines}</div>`;
    }).join("");
  }
}

renderStamps();
refreshIntroCount();
</script>
</body>
</html>
